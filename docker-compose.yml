x-web_env: &web_env
  environment:
      REDIS_HOST: redis
      SOLR_USERNAME: scholarsphere
      SOLR_PASSWORD: scholarsphere
      BUNDLE_DEFAULT_INSTALL_USES_PATH: vendor/bundle
      REDIS_PASSWORD: redispassword
      OAUTH_APP_ID: ${OAUTH_APP_ID}
      OAUTH_APP_SECRET: ${OAUTH_APP_SECRET}
      DEFAULT_URL_HOST: ${DEFAULT_URL_HOST:-web}
      SELENIUM_URL: http://selenium:4444/wd/hub
      APP_HOST: web
      OAUTH_APP_URL: ${OAUTH_APP_URL}
      OAUTH_TOKEN_URL: ${OAUTH_TOKEN_URL}
      OAUTH_AUTHORIZE_URL: ${OAUTH_AUTHORIZE_URL}
      POSTGRES_DB: scholarsphere
      POSTGRES_USER: scholarsphere
      POSTGRES_PASSWORD: scholarsphere
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-scholarsphere}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-scholarsphere}
      AWS_BUCKET: scholarsphere
      AWS_REGION: us-east-1
      S3_ENDPOINT: ${S3_ENDPOINT:-http://docker.for.mac.localhost:8333}
      RAILS_ENV: ${RAILS_ENV:-development}
      SOLR_HOST: solr
      SOLR_COLLECTION: scholarsphere
      POSTGRES_HOST: db
      AZURE_GRAPH_GROUPS: ${AZURE_GRAPH_GROUPS}
      ADMIN_GROUP: ${ADMIN_GROUP}
      PSU_AFFILIATED_GROUP: ${PSU_AFFILIATED_GROUP}
      PDF_REMEDIATION_ENDPOINT: ${PDF_REMEDIATION_ENDPOINT}
      PDF_REMEDIATION_API_KEY: ${PDF_REMEDIATION_API_KEY}
      RMD_API_KEY: ${RMD_API_KEY}
      RMD_WEBHOOK_SECRET: ${RMD_WEBHOOK_SECRET}
      RMD_HOST: ${RMD_HOST}
      LIBANSWERS_CLIENT_SECRET: ${LIBANSWERS_CLIENT_SECRET}
      LIBANSWERS_CLIENT_ID: ${LIBANSWERS_CLIENT_ID}
      # TODO: Remove when open access feature flag is removed
      ENABLE_OPEN_ACCESS_FEATURE: ${ENABLE_OPEN_ACCESS_FEATURE:-true}
services:
  redis:
    image: redis:8
    command: redis-server --requirepass redispassword
    volumes:
      - redis-data:/data
    ports:
    - "6379:6379"
  web:
    tty: true
    stdin_open: true
    <<: *web_env
    build:
      context: .
      target: dev
    volumes:
    - bundle-data:/app/vendor/bundle
    - node-data:/app/node_modules
    - type: bind
      source: ./
      target: /app
    ports:
      - "3000:3000"
    depends_on:
      solr:
        condition: service_healthy
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    ports:
      - ${SEAWEEEDFS_S3_PORT:-8333}:8333 # S3 API
      - 8888:8888 # File Browser GUI
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-scholarsphere}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-scholarsphere}
      S3_BUCKET: scholarsphere
    volumes:
      - seaweedfs-data:/data
  solr:
    image: solr:9.11.0
    restart: always
    environment:
      SOLR_STOP_WAIT: 10
      SOLR_USERNAME: scholarsphere
      SOLR_PASSWORD: scholarsphere
      SOLR_MODULES: analysis-extras
      SOLR_OPTS: "-Dsolr.config.lib.enabled=true"
    volumes:
    - solr-data:/var/solr
    - type: bind
      source: ./solr
      target: /opt/solr/server/solr/configsets
    ports:
    - ${SOLR_PORT:-8983}:8983
    command: [
      "/bin/bash",
      "-c",
      "for i in {1..60}; do echo > /dev/tcp/localhost/9983 2>/dev/null && break; sleep 1; done; solr -c && solr auth enable -credentials $$SOLR_USERNAME:$$SOLR_PASSWORD -z localhost:9983; solr stop && solr start -c -f",
    ]
    healthcheck:
      test: [
        "CMD-SHELL",
        "wget -qO- --user=$$SOLR_USERNAME --password=$$SOLR_PASSWORD http://localhost:8983/solr/admin/info/system | grep -q 'solr_home'"
      ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  db:
    environment:
      POSTGRES_PASSWORD: scholarsphere
      POSTGRES_USER: scholarsphere
      POSTGRES_DB: scholarsphere
    image: postgres:15.2
    ports:
    - "5432:5432"
    volumes:
    - db-data:/var/lib/postgresql/data

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400

volumes:
  redis-data:
  bundle-data:
  node-data:
  solr-data:
  db-data:
  seaweedfs-data:
